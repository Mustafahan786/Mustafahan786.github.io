<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">AFM closed-loop control architecture</title><desc id="desc">Illustrative block diagram of the contact-mode AFM Z-axis feedback loop.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".18"/></filter></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/><text x="70" y="86" fill="#93c5fd" font-family="Inter,Arial" font-size="24" font-weight="700" letter-spacing="4">CONTACT-MODE AFM</text><text x="70" y="140" fill="white" font-family="Inter,Arial" font-size="44" font-weight="800">High-bandwidth Z-axis feedback</text><g filter="url(#shadow)" font-family="Inter,Arial"><rect x="70" y="255" width="180" height="118" rx="20" fill="#fff"/><text x="160" y="302" text-anchor="middle" fill="#64748b" font-size="18">REFERENCE</text><text x="160" y="340" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="800">Setpoint</text><rect x="310" y="255" width="210" height="118" rx="20" fill="#dbeafe"/><text x="415" y="302" text-anchor="middle" fill="#1d4ed8" font-size="18">CONTROLLER</text><text x="415" y="340" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="800">PI + Notch</text><rect x="580" y="255" width="220" height="118" rx="20" fill="#fff"/><text x="690" y="302" text-anchor="middle" fill="#64748b" font-size="18">ACTUATION</text><text x="690" y="340" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="800">DAC → HV → PZT</text><rect x="860" y="255" width="270" height="118" rx="20" fill="#e0f2fe"/><text x="995" y="302" text-anchor="middle" fill="#0369a1" font-size="18">PHYSICAL SYSTEM</text><text x="995" y="340" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="800">Cantilever / Sample</text>