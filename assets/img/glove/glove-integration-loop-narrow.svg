<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700" width="340" height="700" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Bilateral master–slave control of the game and the glove</title>
  <desc id="d">System schematic. The functional hand is the master input: a Myo armband on its forearm acquires sEMG and
    sends it to a Raspberry Pi 4, which performs signal processing and machine-learning gesture recognition and outputs
    one of two states, close or open/rest. The state branches to the interactive game, Cave Dive, where the ball moves up
    or down, and to the pneumatic drive of pump and valve, which supplies air to inflate or release the soft glove on the
    impaired hand, the slave. The game gives visual feedback to the participant.</desc>
  <defs>
    <marker id="ns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c5549"/>
    </marker>
    <marker id="na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f5c6e"/>
    </marker>
    <marker id="nf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a0937c"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#eaf1f3; stroke:#0f5c6e; stroke-width:1.75 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:12.5px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .ml { font-size:12.5px; font-weight:600; fill:#0f5c6e; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .chip { fill:#ffffff; stroke:#0f5c6e; stroke-width:1.2 }
      .ct { font-size:12.5px; font-weight:600; fill:#0f5c6e; text-anchor:middle }
      .sig { stroke:#5c5549; stroke-width:1.6; fill:none }
      .air { stroke:#0f5c6e; stroke-width:2.8; fill:none }
      .fb { stroke:#a0937c; stroke-width:1.6; fill:none; stroke-dasharray:6 5 }
      .note { font-size:13px; fill:#565d66 }
    </style>
  </defs>
  <rect width="340" height="700" fill="#fbfaf7"/>

  <rect x="26" y="16" width="302" height="68" rx="4" class="box"/>
  <text x="40" y="44" class="t">Functional hand</text>
  <text x="40" y="67" class="s">master input</text>
  <line x1="177" y1="84" x2="177" y2="112" class="sig" marker-end="url(#ns)"/>

  <rect x="26" y="114" width="302" height="68" rx="4" class="box"/>
  <text x="40" y="142" class="t">Myo armband</text>
  <text x="40" y="165" class="s">sEMG acquisition</text>
  <line x1="177" y1="182" x2="177" y2="210" class="sig" marker-end="url(#ns)"/>
  <text x="187" y="201" class="note">sEMG</text>

  <rect x="26" y="212" width="302" height="128" rx="4" class="key"/>
  <text x="40" y="240" class="t">Raspberry Pi 4</text>
  <text x="40" y="263" class="s">signal processing</text>
  <text x="40" y="284" class="ml">ML gesture recognition</text>
  <rect x="40" y="300" width="62" height="26" rx="13" class="chip"/>
  <text x="71" y="318" class="ct">close</text>
  <rect x="112" y="300" width="92" height="26" rx="13" class="chip"/>
  <text x="158" y="318" class="ct">open/rest</text>

  <!-- one state, two branches -->
  <path d="M177 340 V362" class="sig"/>
  <path d="M177 362 H98 V394" class="sig" marker-end="url(#ns)"/>
  <path d="M177 362 H255 V394" class="sig" marker-end="url(#ns)"/>
  <circle cx="177" cy="362" r="3.2" fill="#5c5549"/>

  <rect x="26" y="396" width="145" height="84" rx="4" class="box"/>
  <text x="37" y="423" class="t">Interactive game</text>
  <text x="37" y="446" class="s">Cave Dive</text>
  <text x="37" y="466" class="s">ball ↑ or ↓</text>
  <rect x="183" y="396" width="145" height="84" rx="4" class="box"/>
  <text x="194" y="423" class="t">Pneumatic drive</text>
  <text x="194" y="446" class="s">pump and valve</text>

  <line x1="255" y1="480" x2="255" y2="512" class="air" marker-end="url(#na)"/>
  <text x="265" y="501" class="note">air</text>

  <rect x="183" y="514" width="145" height="84" rx="4" class="box"/>
  <text x="194" y="541" class="t">Soft glove</text>
  <text x="194" y="564" class="s">impaired hand</text>
  <text x="194" y="584" class="s">slave</text>

  <!-- visual feedback: game back to the participant -->
  <path d="M26 438 H11 V50 H24" class="fb" marker-end="url(#nf)"/>
  <text x="26" y="508" class="note">visual feedback</text>
  <text x="26" y="526" class="note">to the participant</text>

  <!-- legend -->
  <line x1="26" y1="630" x2="56" y2="630" class="sig"/>
  <text x="64" y="634" class="note">command</text>
  <line x1="26" y1="654" x2="56" y2="654" class="air"/>
  <text x="64" y="658" class="note">air</text>
  <line x1="26" y1="678" x2="56" y2="678" class="fb"/>
  <text x="64" y="682" class="note">visual feedback</text>
</svg>
