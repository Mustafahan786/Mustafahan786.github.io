<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Bilateral master–slave control of the game and the glove</title>
  <desc id="d">System schematic. Within the participant, the functional hand is the master input: a Myo armband on its
    forearm acquires sEMG and sends it to a Raspberry Pi 4, which performs signal processing and machine-learning gesture
    recognition and outputs one of two states, close or open/rest. The state branches to the interactive game, Cave
    Dive, where the ball moves up or down, and to the pneumatic drive of pump and valve, which supplies air to inflate or
    release the soft glove on the impaired hand, the slave. The game gives visual feedback to the participant.</desc>
  <defs>
    <marker id="bs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c5549"/>
    </marker>
    <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f5c6e"/>
    </marker>
    <marker id="bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a0937c"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#eaf1f3; stroke:#0f5c6e; stroke-width:1.75 }
      .grp { fill:none; stroke:#cfc8bb; stroke-width:1.25; stroke-dasharray:4 4 }
      .cap { font-size:12px; font-weight:600; letter-spacing:0.07em; fill:#8f8574 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:12.5px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .ml { font-size:12.5px; font-weight:600; fill:#0f5c6e; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .chip { fill:#ffffff; stroke:#0f5c6e; stroke-width:1.2 }
      .ct { font-size:12.5px; font-weight:600; fill:#0f5c6e; text-anchor:middle }
      .sig { stroke:#5c5549; stroke-width:1.6; fill:none }
      .air { stroke:#0f5c6e; stroke-width:2.8; fill:none }
      .fb { stroke:#a0937c; stroke-width:1.6; fill:none; stroke-dasharray:6 5 }
      .note { font-size:13px; fill:#565d66 }
    </style>
  </defs>
  <rect width="900" height="440" fill="#fbfaf7"/>

  <!-- visual feedback: game back to the participant -->
  <path d="M795 84 V42 H131 V60" class="fb" marker-end="url(#bf)"/>
  <text x="466" y="32" class="note" text-anchor="middle">visual feedback to the participant</text>

  <!-- participant: master input and slave assistance -->
  <rect x="16" y="62" width="230" height="362" rx="6" class="grp"/>
  <text x="30" y="85" class="cap">PARTICIPANT</text>
  <rect x="30" y="100" width="202" height="72" rx="4" class="box"/>
  <text x="44" y="129" class="t">Functional hand</text>
  <text x="44" y="153" class="s">master input</text>
  <rect x="30" y="318" width="202" height="72" rx="4" class="box"/>
  <text x="44" y="347" class="t">Soft glove</text>
  <text x="44" y="371" class="s">impaired hand · slave</text>

  <!-- acquisition and recognition -->
  <rect x="278" y="100" width="146" height="72" rx="4" class="box"/>
  <text x="292" y="129" class="t">Myo armband</text>
  <text x="292" y="153" class="s">sEMG acquisition</text>
  <rect x="470" y="84" width="198" height="136" rx="4" class="key"/>
  <text x="484" y="112" class="t">Raspberry Pi 4</text>
  <text x="484" y="136" class="s">signal processing</text>
  <text x="484" y="157" class="ml">ML gesture recognition</text>
  <rect x="484" y="174" width="62" height="26" rx="13" class="chip"/>
  <text x="515" y="192" class="ct">close</text>
  <rect x="556" y="174" width="92" height="26" rx="13" class="chip"/>
  <text x="602" y="192" class="ct">open/rest</text>

  <!-- outputs -->
  <rect x="706" y="84" width="178" height="70" rx="4" class="box"/>
  <text x="720" y="112" class="t">Interactive game</text>
  <text x="720" y="136" class="s">Cave Dive · ball ↑ ↓</text>
  <rect x="706" y="318" width="178" height="72" rx="4" class="box"/>
  <text x="720" y="347" class="t">Pneumatic drive</text>
  <text x="720" y="371" class="s">pump and valve</text>

  <!-- command path -->
  <line x1="232" y1="136" x2="276" y2="136" class="sig" marker-end="url(#bs)"/>
  <line x1="424" y1="136" x2="468" y2="136" class="sig" marker-end="url(#bs)"/>
  <text x="446" y="127" class="note" text-anchor="middle">sEMG</text>
  <path d="M569 220 V252 H795" class="sig"/>
  <path d="M795 252 V156" class="sig" marker-end="url(#bs)"/>
  <path d="M795 252 V316" class="sig" marker-end="url(#bs)"/>
  <circle cx="795" cy="252" r="3.2" fill="#5c5549"/>

  <!-- air to the glove -->
  <line x1="706" y1="354" x2="234" y2="354" class="air" marker-end="url(#ba)"/>
  <text x="470" y="344" class="note" text-anchor="middle">air: inflate or release</text>

  <!-- legend -->
  <line x1="278" y1="412" x2="308" y2="412" class="sig"/>
  <text x="316" y="416" class="note">command</text>
  <line x1="392" y1="412" x2="422" y2="412" class="air"/>
  <text x="430" y="416" class="note">air</text>
  <line x1="470" y1="412" x2="500" y2="412" class="fb"/>
  <text x="508" y="416" class="note">visual feedback</text>
</svg>
