<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 676" width="340" height="676" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Electrical control path and pneumatic supply path of the glove</title>
  <desc id="d">Block diagram. Electrical control: the Myo armband acquires sEMG and sends it to a Raspberry Pi 4 for
    machine-learning gesture recognition; the Pi drives a two-channel relay, on for close and off for open/rest, which
    switches 12-volt power to the diaphragm pump and the solenoid valve. Pneumatic supply: air flows from the diaphragm
    pump, rated to 100 kilopascals, through the on/off solenoid valve to five soft actuators supplied in parallel, which
    inflate, hold while close persists, and release.</desc>
  <defs>
    <marker id="qs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c5549"/>
    </marker>
    <marker id="qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f5c6e"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#eaf1f3; stroke:#0f5c6e; stroke-width:1.75 }
      .cap { font-size:12px; font-weight:600; letter-spacing:0.07em; fill:#8f8574 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:12.5px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .ml { font-size:12.5px; font-weight:600; fill:#0f5c6e; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .sig { stroke:#5c5549; stroke-width:1.6; fill:none }
      .air { stroke:#0f5c6e; stroke-width:2.8; fill:none }
      .note { font-size:13px; fill:#565d66 }
    </style>
  </defs>
  <rect width="340" height="676" fill="#fbfaf7"/>

  <text x="16" y="26" class="cap">ELECTRICAL CONTROL</text>
  <rect x="16" y="38" width="250" height="62" rx="4" class="box"/>
  <text x="30" y="64" class="t">Myo armband</text>
  <text x="30" y="86" class="s">sEMG acquisition</text>
  <line x1="141" y1="100" x2="141" y2="126" class="sig" marker-end="url(#qs)"/>
  <text x="151" y="117" class="note">sEMG</text>

  <rect x="16" y="128" width="250" height="62" rx="4" class="key"/>
  <text x="30" y="154" class="t">Raspberry Pi 4</text>
  <text x="30" y="176" class="ml">ML gesture recognition</text>
  <line x1="141" y1="190" x2="141" y2="216" class="sig" marker-end="url(#qs)"/>
  <text x="151" y="207" class="note">close: on · open/rest: off</text>

  <rect x="16" y="218" width="250" height="62" rx="4" class="box"/>
  <text x="30" y="244" class="t">Two-channel relay</text>
  <text x="30" y="266" class="s">12 V switching</text>

  <!-- the relay powers the pump and the valve -->
  <path d="M266 249 H306 V365 H268" class="sig" marker-end="url(#qs)"/>
  <path d="M306 365 V455 H268" class="sig" marker-end="url(#qs)"/>
  <circle cx="306" cy="365" r="3.2" fill="#5c5549"/>
  <text x="274" y="306" class="note">12 V</text>

  <text x="16" y="322" class="cap">PNEUMATIC SUPPLY</text>
  <rect x="16" y="334" width="250" height="62" rx="4" class="box"/>
  <text x="30" y="360" class="t">Diaphragm pump</text>
  <text x="30" y="382" class="s">12 V · rated 100 kPa</text>
  <line x1="141" y1="396" x2="141" y2="422" class="air" marker-end="url(#qa)"/>
  <text x="151" y="413" class="note">air</text>

  <rect x="16" y="424" width="250" height="62" rx="4" class="box"/>
  <text x="30" y="450" class="t">Solenoid valve</text>
  <text x="30" y="472" class="s">12 V · on/off</text>
  <line x1="141" y1="486" x2="141" y2="512" class="air" marker-end="url(#qa)"/>
  <text x="151" y="503" class="note">air</text>

  <rect x="16" y="514" width="250" height="84" rx="4" class="box"/>
  <text x="30" y="540" class="t">Soft actuators</text>
  <text x="30" y="562" class="s">five, supplied in parallel</text>
  <text x="30" y="582" class="s">inflate · hold · release</text>

  <!-- legend -->
  <line x1="16" y1="630" x2="46" y2="630" class="sig"/>
  <text x="54" y="634" class="note">electrical signal and power</text>
  <line x1="16" y1="654" x2="46" y2="654" class="air"/>
  <text x="54" y="658" class="note">air</text>
</svg>
