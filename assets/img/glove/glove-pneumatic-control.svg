<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" width="780" height="376" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Electrical control path and pneumatic supply path of the glove</title>
  <desc id="d">Block diagram in two columns. Electrical control: the Myo armband acquires sEMG and sends it to a Raspberry
    Pi 4 for machine-learning gesture recognition; the Pi drives a two-channel relay, on for close and off for open/rest,
    which switches 12-volt power to the diaphragm pump and the solenoid valve. Pneumatic supply: air flows from the
    diaphragm pump, rated to 100 kilopascals, through the on/off solenoid valve to five soft actuators supplied in
    parallel, which inflate, hold while close persists, and release.</desc>
  <defs>
    <marker id="ps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c5549"/>
    </marker>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f5c6e"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#eaf1f3; stroke:#0f5c6e; stroke-width:1.75 }
      .cap { font-size:12px; font-weight:600; letter-spacing:0.07em; fill:#8f8574 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:12.5px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .ml { font-size:12.5px; font-weight:600; fill:#0f5c6e; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .sig { stroke:#5c5549; stroke-width:1.6; fill:none }
      .air { stroke:#0f5c6e; stroke-width:2.8; fill:none }
      .note { font-size:13px; fill:#565d66 }
    </style>
  </defs>
  <rect width="780" height="376" fill="#fbfaf7"/>

  <text x="40" y="28" class="cap">ELECTRICAL CONTROL</text>
  <text x="452" y="28" class="cap">PNEUMATIC SUPPLY</text>

  <!-- electrical control path, top to bottom -->
  <rect x="40" y="44" width="290" height="66" rx="4" class="box"/>
  <text x="54" y="72" class="t">Myo armband</text>
  <text x="54" y="95" class="s">sEMG acquisition</text>
  <line x1="185" y1="110" x2="185" y2="148" class="sig" marker-end="url(#ps)"/>
  <text x="195" y="134" class="note">sEMG</text>

  <rect x="40" y="150" width="290" height="66" rx="4" class="key"/>
  <text x="54" y="178" class="t">Raspberry Pi 4</text>
  <text x="54" y="201" class="ml">ML gesture recognition</text>
  <line x1="185" y1="216" x2="185" y2="254" class="sig" marker-end="url(#ps)"/>
  <text x="195" y="240" class="note">close: on · open/rest: off</text>

  <rect x="40" y="256" width="290" height="66" rx="4" class="box"/>
  <text x="54" y="284" class="t">Two-channel relay</text>
  <text x="54" y="307" class="s">12 V switching</text>

  <!-- the relay powers the pump and the valve -->
  <path d="M330 289 H391 V77 H450" class="sig" marker-end="url(#ps)"/>
  <path d="M391 183 H450" class="sig" marker-end="url(#ps)"/>
  <circle cx="391" cy="183" r="3.2" fill="#5c5549"/>
  <text x="398" y="240" class="note">12 V</text>

  <!-- pneumatic supply path, top to bottom -->
  <rect x="452" y="44" width="290" height="66" rx="4" class="box"/>
  <text x="466" y="72" class="t">Diaphragm pump</text>
  <text x="466" y="95" class="s">12 V · rated 100 kPa</text>
  <line x1="597" y1="110" x2="597" y2="148" class="air" marker-end="url(#pa)"/>
  <text x="607" y="134" class="note">air</text>

  <rect x="452" y="150" width="290" height="66" rx="4" class="box"/>
  <text x="466" y="178" class="t">Solenoid valve</text>
  <text x="466" y="201" class="s">12 V · on/off</text>
  <line x1="597" y1="216" x2="597" y2="254" class="air" marker-end="url(#pa)"/>
  <text x="607" y="240" class="note">air</text>

  <rect x="452" y="256" width="290" height="84" rx="4" class="box"/>
  <text x="466" y="284" class="t">Soft actuators</text>
  <text x="466" y="307" class="s">five, supplied in parallel</text>
  <text x="466" y="327" class="s">inflate · hold · release</text>

  <!-- legend -->
  <line x1="40" y1="358" x2="70" y2="358" class="sig"/>
  <text x="78" y="362" class="note">electrical signal and power</text>
  <line x1="262" y1="358" x2="292" y2="358" class="air"/>
  <text x="300" y="362" class="note">air</text>
</svg>
