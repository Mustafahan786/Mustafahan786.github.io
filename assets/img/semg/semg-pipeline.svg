<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Real-time sEMG control loop</title>
  <desc id="d">Block diagram. A Myo armband streams eight channels of forearm sEMG at 200 hertz over Bluetooth.
    The signal is cut into 150 millisecond windows with 73 percent overlap; four time-domain features per
    channel (integrated EMG, mean absolute value, root mean square and waveform length) give 32 features,
    which are z-score normalised. A gradient-boosting classifier trained offline predicts the gesture for each
    window, and the game moves its avatar accordingly. The participant sees the result and adjusts the next
    gesture, closing the loop through the muscle activity recorded by the armband.</desc>
  <defs>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8574"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#e7eff1; stroke:#0f5c6e; stroke-width:1.75 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:13px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .l { stroke:#8f8574; stroke-width:1.6; fill:none }
      .note { font-size:13.5px; fill:#565d66 }
    </style>
  </defs>
  <rect width="760" height="232" fill="#fbfaf7"/>

  <!-- row 1: acquisition and features -->
  <rect x="14" y="30" width="168" height="62" rx="4" class="b"/>
  <text x="28" y="56" class="t">Myo armband</text>
  <text x="28" y="78" class="s">8 ch · 200 Hz</text>
  <line x1="182" y1="61" x2="206" y2="61" class="l" marker-end="url(#ahs)"/>

  <rect x="208" y="30" width="168" height="62" rx="4" class="b"/>
  <text x="222" y="56" class="t">Window</text>
  <text x="222" y="78" class="s">150 ms · 73 %</text>
  <line x1="376" y1="61" x2="400" y2="61" class="l" marker-end="url(#ahs)"/>

  <rect x="402" y="30" width="168" height="62" rx="4" class="b"/>
  <text x="416" y="56" class="t">Features</text>
  <text x="416" y="78" class="s">IEMG MAV RMS WL</text>
  <line x1="570" y1="61" x2="594" y2="61" class="l" marker-end="url(#ahs)"/>

  <rect x="596" y="30" width="150" height="62" rx="4" class="b"/>
  <text x="610" y="56" class="t">Z-score</text>
  <text x="610" y="78" class="s">32 features</text>

  <!-- row 2: decision, game, participant -->
  <line x1="671" y1="92" x2="671" y2="148" class="l" marker-end="url(#ahs)"/>
  <rect x="580" y="150" width="166" height="62" rx="4" class="b key"/>
  <text x="594" y="176" class="t">Classifier</text>
  <text x="594" y="198" class="s">gradient boosting</text>
  <line x1="580" y1="181" x2="532" y2="181" class="l" marker-end="url(#ahs)"/>
  <text x="556" y="172" class="note" text-anchor="middle">label</text>

  <rect x="364" y="150" width="166" height="62" rx="4" class="b"/>
  <text x="378" y="176" class="t">Game</text>
  <text x="378" y="198" class="s">1, 2 or 3 DOF</text>
  <line x1="364" y1="181" x2="302" y2="181" class="l" marker-end="url(#ahs)"/>
  <text x="333" y="172" class="note" text-anchor="middle">display</text>

  <rect x="134" y="150" width="166" height="62" rx="4" class="b"/>
  <text x="148" y="176" class="t">Participant</text>
  <text x="148" y="198" class="s">next gesture</text>
  <path d="M134 181 H98 V94" class="l" marker-end="url(#ahs)"/>
  <text x="18" y="130" class="note">muscle</text>
  <text x="18" y="148" class="note">activity</text>

</svg>
