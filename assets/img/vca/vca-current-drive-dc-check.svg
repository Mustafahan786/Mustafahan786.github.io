<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Current-drive DC checks reported in the project slides</title>
  <desc id="d">Five reported DC checks: input voltages of 1, 2, 3, 4 and 5 volts correspond to current magnitudes of
    0.1, 0.2, 0.3, 0.4 and 0.5 amperes, calculated from sense-voltage magnitudes across 5 ohms. The points reproduce
    rounded slide readings; no line is fitted and no uncertainty was recorded.</desc>
  <style>
    .ax { stroke:#8f8574; stroke-width:1.2; fill:none }
    .gr { stroke:#e4dfd4; stroke-width:1 }
    .tk { font-size:14px; fill:#565d66 }
    .al { font-size:14px; fill:#3a4048 }
    .vl { font-size:13.5px; fill:#1d2126; font-weight:500 }
  </style>
  <rect width="480" height="300" fill="#fbfaf7"/>
  <line class="gr" x1="70" y1="212.7" x2="462" y2="212.7"/>
  <line class="gr" x1="70" y1="175.3" x2="462" y2="175.3"/>
  <line class="gr" x1="70" y1="138.0" x2="462" y2="138.0"/>
  <line class="gr" x1="70" y1="100.7" x2="462" y2="100.7"/>
  <line class="gr" x1="70" y1="63.3" x2="462" y2="63.3"/>
  <path class="ax" d="M70 20 V250 H462"/>
  <text class="tk" x="61" y="255.0" text-anchor="end">0.0</text>
  <text class="tk" x="61" y="217.7" text-anchor="end">0.1</text>
  <text class="tk" x="61" y="180.3" text-anchor="end">0.2</text>
  <text class="tk" x="61" y="143.0" text-anchor="end">0.3</text>
  <text class="tk" x="61" y="105.7" text-anchor="end">0.4</text>
  <text class="tk" x="61" y="68.3" text-anchor="end">0.5</text>
  <line class="ax" x1="109.2" y1="250" x2="109.2" y2="255"/>
  <text class="tk" x="109.2" y="272" text-anchor="middle">1</text>
  <line class="ax" x1="187.6" y1="250" x2="187.6" y2="255"/>
  <text class="tk" x="187.6" y="272" text-anchor="middle">2</text>
  <line class="ax" x1="266.0" y1="250" x2="266.0" y2="255"/>
  <text class="tk" x="266.0" y="272" text-anchor="middle">3</text>
  <line class="ax" x1="344.4" y1="250" x2="344.4" y2="255"/>
  <text class="tk" x="344.4" y="272" text-anchor="middle">4</text>
  <line class="ax" x1="422.8" y1="250" x2="422.8" y2="255"/>
  <text class="tk" x="422.8" y="272" text-anchor="middle">5</text>
  <text class="al" x="266.0" y="294" text-anchor="middle">Input voltage <tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3">in</tspan><tspan dy="-3"> (V)</tspan></text>
  <text class="al" transform="translate(20 138.0) rotate(-90)" text-anchor="middle">Current magnitude |<tspan font-style="italic">i</tspan>| (A)</text>
  <circle cx="109.2" cy="212.7" r="5.5" fill="#0f5c6e"/>
  <text class="vl" x="109.2" y="199.7" text-anchor="middle">0.1 A</text>
  <circle cx="187.6" cy="175.3" r="5.5" fill="#0f5c6e"/>
  <text class="vl" x="187.6" y="162.3" text-anchor="middle">0.2 A</text>
  <circle cx="266.0" cy="138.0" r="5.5" fill="#0f5c6e"/>
  <text class="vl" x="266.0" y="125.0" text-anchor="middle">0.3 A</text>
  <circle cx="344.4" cy="100.7" r="5.5" fill="#0f5c6e"/>
  <text class="vl" x="344.4" y="87.7" text-anchor="middle">0.4 A</text>
  <circle cx="422.8" cy="63.3" r="5.5" fill="#0f5c6e"/>
  <text class="vl" x="422.8" y="50.3" text-anchor="middle">0.5 A</text>
</svg>
