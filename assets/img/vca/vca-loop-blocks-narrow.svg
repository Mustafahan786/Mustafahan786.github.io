<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 552" width="360" height="552" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Analogue position-feedback loop for the voice-coil stage</title>
  <desc id="d">Block diagram of the position loop. The reference voltage V ref is compared with the sensor voltage V sensor at a summing junction. The error e drives an analogue controller, whose output commands a PA51 current amplifier of 0.1 amperes per volt, which is inverting. The coil current i drives the voice-coil stage, and its position x is measured by a Keyence IL-065 laser displacement sensor at 0.1 volts per millimetre, which returns V sensor to the summing junction.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8574"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#e7eff1; stroke:#0f5c6e; stroke-width:1.75 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:13px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .l { stroke:#8f8574; stroke-width:1.6; fill:none }
      .sig { font-size:14px; fill:#3a4048; font-style:italic }
      .pm { font-size:15px; fill:#3a4048 }
    </style>
  </defs>
  <rect width="360" height="552" fill="#fbfaf7"/>
  <text x="6" y="20" class="sig"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">ref</tspan><tspan dy="-3"></tspan></text>
  <line x1="6" y1="44" x2="106" y2="44" class="l" marker-end="url(#ah)"/>
  <circle cx="128" cy="44" r="18" fill="#ffffff" stroke="#8f8574" stroke-width="1.6"/>
  <text x="128" y="50" class="t" text-anchor="middle">Σ</text>
  <text x="96" y="36" class="pm">+</text>
  <text x="150" y="38" class="pm">−</text>
  <line x1="128" y1="64" x2="128" y2="96" class="l" marker-end="url(#ah)"/>
  <text x="137" y="88" class="sig">e</text>
  <rect x="16" y="98" width="268" height="64" rx="4" class="b key"/>
  <text x="32" y="125" class="t">Analogue controller</text>
  <text x="32" y="146" class="s">PD · lead · lag</text>
  <line x1="128" y1="164" x2="128" y2="218" class="l" marker-end="url(#ah)"/>
  <text x="137" y="199" class="sig"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">c</tspan><tspan dy="-3"></tspan></text>
  <rect x="16" y="220" width="268" height="64" rx="4" class="b"/>
  <text x="32" y="247" class="t">PA51 current amplifier</text>
  <text x="32" y="268" class="s">0.1 A/V, inverting</text>
  <line x1="128" y1="286" x2="128" y2="340" class="l" marker-end="url(#ah)"/>
  <text x="137" y="321" class="sig">i</text>
  <rect x="16" y="342" width="268" height="64" rx="4" class="b"/>
  <text x="32" y="369" class="t">Voice-coil stage</text>
  <text x="32" y="390" class="s">coil and magnet on rods</text>
  <line x1="128" y1="408" x2="128" y2="462" class="l" marker-end="url(#ah)"/>
  <text x="137" y="443" class="sig">x</text>
  <rect x="16" y="464" width="268" height="64" rx="4" class="b"/>
  <text x="32" y="491" class="t">Laser displacement sensor</text>
  <text x="32" y="512" class="s">Keyence IL-065 · 0.1 V/mm</text>
  <line x1="284" y1="496" x2="332" y2="496" class="l"/>
  <line x1="332" y1="496" x2="332" y2="44" class="l"/>
  <line x1="332" y1="44" x2="148" y2="44" class="l" marker-end="url(#ah)"/>
  <text transform="translate(321 270) rotate(-90)" class="sig" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">sensor</tspan><tspan dy="-3"></tspan></text>
</svg>
