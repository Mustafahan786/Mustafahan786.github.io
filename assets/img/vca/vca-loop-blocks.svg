<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"
     aria-labelledby="t d" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Analogue position-feedback loop for the voice-coil stage</title>
  <desc id="d">Block diagram of the position loop. The reference voltage V ref is compared with the sensor voltage V sensor at a summing junction. The error e drives an analogue controller, whose output commands a PA51 current amplifier of 0.1 amperes per volt, which is inverting. The coil current i drives the voice-coil stage, and its position x is measured by a Keyence IL-065 laser displacement sensor at 0.1 volts per millimetre, which returns V sensor to the summing junction.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8574"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#d9d3c7; stroke-width:1.5 }
      .key { fill:#e7eff1; stroke:#0f5c6e; stroke-width:1.75 }
      .t { font-size:16px; font-weight:600; fill:#1d2126 }
      .s { font-size:13px; fill:#565d66; font-family:'IBM Plex Mono', ui-monospace, monospace }
      .l { stroke:#8f8574; stroke-width:1.6; fill:none }
      .sig { font-size:14px; fill:#3a4048; font-style:italic }
      .pm { font-size:15px; fill:#3a4048 }
    </style>
  </defs>
  <rect width="860" height="300" fill="#fbfaf7"/>
  <text x="6" y="70" class="sig"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">ref</tspan><tspan dy="-3"></tspan></text>
  <line x1="6" y1="96" x2="34" y2="96" class="l" marker-end="url(#ah)"/>
  <circle cx="56" cy="96" r="18" fill="#ffffff" stroke="#8f8574" stroke-width="1.6"/>
  <text x="56" y="102" class="t" text-anchor="middle">Σ</text>
  <text x="24" y="88" class="pm">+</text>
  <text x="65" y="134" class="pm">−</text>
  <line x1="74" y1="96" x2="94" y2="96" class="l" marker-end="url(#ah)"/>
  <text x="85" y="86" class="sig" text-anchor="middle">e</text>
  <rect x="96" y="64" width="230" height="64" rx="4" class="b key"/>
  <text x="112" y="91" class="t">Analogue controller</text>
  <text x="112" y="112" class="s">PD · lead · lag</text>
  <line x1="326" y1="96" x2="354" y2="96" class="l" marker-end="url(#ah)"/>
  <text x="341" y="86" class="sig" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">c</tspan><tspan dy="-3"></tspan></text>
  <rect x="356" y="64" width="230" height="64" rx="4" class="b"/>
  <text x="372" y="91" class="t">PA51 current amplifier</text>
  <text x="372" y="112" class="s">0.1 A/V, inverting</text>
  <line x1="586" y1="96" x2="614" y2="96" class="l" marker-end="url(#ah)"/>
  <text x="601" y="86" class="sig" text-anchor="middle">i</text>
  <rect x="616" y="64" width="230" height="64" rx="4" class="b"/>
  <text x="632" y="91" class="t">Voice-coil stage</text>
  <text x="632" y="112" class="s">coil and magnet on rods</text>
  <line x1="731" y1="128" x2="731" y2="194" class="l" marker-end="url(#ah)"/>
  <text x="741" y="168" class="sig">x</text>
  <rect x="546" y="196" width="300" height="64" rx="4" class="b"/>
  <text x="562" y="223" class="t">Laser displacement sensor</text>
  <text x="562" y="244" class="s">Keyence IL-065 · 0.1 V/mm</text>
  <line x1="546" y1="228" x2="56" y2="228" class="l"/>
  <line x1="56" y1="228" x2="56" y2="116" class="l" marker-end="url(#ah)"/>
  <text x="301" y="218" class="sig" text-anchor="middle"><tspan font-style="italic">V</tspan><tspan font-size="10.5" dy="3" font-style="normal">sensor</tspan><tspan dy="-3"></tspan></text>
</svg>
